<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Status — Music Player AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
header { background: #1a1a2e; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
header h1 { font-size: 20px; color: #e94560; }
header a { color: #3498db; text-decoration: none; font-size: 14px; }
header a:hover { text-decoration: underline; }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }
.stats-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-card { background: #1a1a2e; border-radius: 8px; padding: 16px 24px; border: 1px solid #222; flex: 1; min-width: 120px; text-align: center; }
.stat-card .num { font-size: 28px; font-weight: 700; color: #e94560; }
.stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }
.stat-card.active-songs .num { color: #2ecc71; }
.stat-card.removed-songs .num { color: #e74c3c; }
table { width: 100%; border-collapse: collapse; background: #1a1a2e; border-radius: 8px; overflow: hidden; border: 1px solid #222; }
th { background: #16213e; padding: 12px 16px; text-align: left; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
td { padding: 12px 16px; border-top: 1px solid #222; font-size: 14px; }
tr.removed { opacity: 0.5; }
tr.removed td:first-child::after { content: " (removed)"; color: #e74c3c; font-size: 11px; }
.song-title { font-weight: 600; }
.song-channel { font-size: 12px; color: #888; }
.skip-count { font-weight: 700; }
.skip-count.high { color: #e74c3c; }
.skip-count.medium { color: #f39c12; }
.skip-count.low { color: #2ecc71; }
.btn { padding: 6px 14px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; transition: all .2s; }
.btn-reset { background: #f39c12; color: #fff; }
.btn-reset:hover { background: #e67e22; }
.btn-refresh { background: #3498db; color: #fff; }
.btn-refresh:hover { background: #2980b9; }
.empty-state { text-align: center; padding: 60px 20px; color: #555; }
.error-state { text-align: center; padding: 60px 20px; color: #e74c3c; }
.toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a2e; color: #ccc; padding: 12px 20px; border-radius: 8px; border-left: 3px solid #2ecc71; box-shadow: 0 4px 20px rgba(0,0,0,.5); font-size: 13px; z-index: 100; animation: slideIn .3s; }
.toast.error { border-left-color: #e74c3c; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>
<header>
  <h1>Collection Status</h1>
  <a href="/">&larr; Back to Music Player</a>
</header>
<div class="container">
  <div id="playerInfo" style="background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;"></div>
  <div class="stats-bar" id="statsBar"></div>
  <div style="margin-bottom: 16px;">
    <button class="btn btn-refresh" onclick="loadStatus()">Refresh</button>
  </div>
  <div id="tableWrap"><div class="loading" style="text-align:center;padding:40px;color:#888;">Loading...</div></div>
</div>
<script>
async function loadStatus() {
  let wrap = document.getElementById('tableWrap');
  let statsBar = document.getElementById('statsBar');
  let playerInfo = document.getElementById('playerInfo');
  try {
    let [statusResp, collectionResp] = await Promise.all([
      fetch('/player/status'),
      fetch('/player/collection'),
    ]);
    let statusData = await statusResp.json();
    let data = await collectionResp.json();

    let currentUser = localStorage.getItem('music_user_id') || 'user_1';

    if (statusData.error) {
      playerInfo.innerHTML = '<span style="color:#e74c3c;">Daemon not connected</span>';
    } else {
      let mode = statusData.mode || 'normal';
      let song = statusData.song || {};
      let modeLabel = mode === 'collection' ? 'Collection mode' : 'Normal mode';
      let nowPlaying = song.title || song.video_id || 'Nothing';
      let statusIcon = statusData.status === 'playing' ? '▶' : statusData.status === 'paused' ? '⏸' : '⏹';
      playerInfo.innerHTML = `
        <span style="background:#16213e;padding:4px 10px;border-radius:4px;font-size:12px;color:#3498db;">${modeLabel}</span>
        <span style="color:#888;">${statusIcon}</span>
        <span style="font-weight:600;font-size:14px;">${escHtml(nowPlaying)}</span>
        <span style="color:#666;font-size:12px;">${statusData.queue_length || 0} in queue</span>
        <span style="color:#888;font-size:12px;">User: <span style="color:#e94560;">${escHtml(currentUser)}</span></span>
      `;
    }
    if (data.error) {
      wrap.innerHTML = '<div class="error-state"><h2>Daemon not running</h2><p>' + data.error + '</p></div>';
      statsBar.innerHTML = '';
      return;
    }
    let songs = data.songs || [];
    let threshold = data.skip_threshold || 3;
    let active = songs.filter(s => (s.skips || 0) < threshold);
    let removed = songs.filter(s => (s.skips || 0) >= threshold);
    statsBar.innerHTML = `
      <div class="stat-card"><div class="num">${songs.length}</div><div class="label">Total Songs</div></div>
      <div class="stat-card active-songs"><div class="num">${active.length}</div><div class="label">Active</div></div>
      <div class="stat-card removed-songs"><div class="num">${removed.length}</div><div class="label">Removed (≥${threshold} skips)</div></div>
    `;
    if (songs.length === 0) {
      wrap.innerHTML = '<div class="empty-state"><h2>Collection is empty</h2><p>Add songs via the daemon\'s collection_add command</p></div>';
      return;
    }
    let rows = songs.map((s, i) => {
      let isRemoved = (s.skips || 0) >= threshold;
      let skipClass = isRemoved ? 'high' : (s.skips || 0) >= 2 ? 'medium' : 'low';
      let thumb = s.video_id ? `https://img.youtube.com/vi/${s.video_id}/mqdefault.jpg` : '';
      let vid = s.video_id || '';
      let resetTarget = vid ? `video_id=${encodeURIComponent(vid)}` : `url=${encodeURIComponent(s.url || '')}`;
      return `<tr class="${isRemoved ? 'removed' : ''}">
        <td>
          ${thumb ? `<img src="${thumb}" style="width:40px;height:30px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:10px;" onerror="this.style.display='none'">` : ''}
          <span class="song-title">${escHtml(s.title || s.video_id || s.url)}</span>
          ${s.channel ? `<div class="song-channel">${escHtml(s.channel)}</div>` : ''}
        </td>
        <td>${s.plays || 0}</td>
        <td><span class="skip-count ${skipClass}">${s.skips || 0}</span></td>
        <td><button class="btn btn-reset" onclick="resetSkip('${vid}', '${escAttr(s.url || '')}')">Reset</button></td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table><thead><tr><th>Song</th><th>Plays</th><th>Skips</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`;
  } catch(e) {
    wrap.innerHTML = '<div class="error-state"><h2>Error</h2><p>' + e.message + '</p></div>';
    statsBar.innerHTML = '';
  }
}
async function resetSkip(videoId, url) {
  let q = new URLSearchParams();
  if (videoId) q.set('video_id', videoId);
  else if (url) q.set('url', url);
  try {
    let r = await fetch('/player/collection/reset_skips?' + q.toString(), {method: 'POST'});
    let data = await r.json();
    if (data.error) { toast(data.error, 'error'); return; }
    toast('Skip count reset for ' + (videoId || url), 'success');
    loadStatus();
  } catch(e) { toast(e.message, 'error'); }
}
function toast(msg, type) {
  let t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function escHtml(s) { let d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.addEventListener('DOMContentLoaded', loadStatus);
</script>
</body>
</html>
